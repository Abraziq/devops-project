<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sallar Groups · Latest Motor Bikes & Prices PKR</title>
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    .bg-soft { background-color: #f8fafc; }
    .border-soft { border-color: #e9edf2; }
    .text-accent { color: #1e3a5f; }
    .bg-accent { background-color: #1e3a5f; }
    .bg-accent-light { background-color: #2b4b72; }
    .bike-card {
      transition: all 0.3s ease;
    }
    .bike-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 30px -10px rgba(0,0,0,0.15);
    }
    .brand-badge {
      transition: all 0.2s ease;
    }
    .brand-badge:hover {
      transform: scale(1.05);
    }
    .brand-badge.active {
      background-color: #1e3a5f;
      color: white;
    }
    .price-tag {
      background: linear-gradient(135deg, #1e3a5f 0%, #2b4b72 100%);
    }
  </style>
</head>
<body class="bg-soft font-sans antialiased text-gray-700">

  <!-- ===== HEADER ===== -->

            <i class="fas fa-chart-line text-xs"></i> Analytics

        <a href="index.html" class="block px-2 py-1.5 rounded hover:bg-gray-100 text-gray-700">Home</a>

      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <span class="text-accent/70 text-sm font-semibold uppercase tracking-widest"><i class="fas fa-motorcycle mr-2"></i>Motor Bikes</span>
          <h1 class="text-3xl md:text-4xl font-bold text-accent mt-1">Latest Bikes & <span class="text-blue-600">Prices in PKR</span></h1>
          <p class="text-gray-500 max-w-xl mt-1 text-sm">Updated prices for Honda, Yamaha, Suzuki, United, and more.</p>
        </div>
        <div class="flex items-center gap-2 text-xs bg-white px-4 py-2 rounded-full shadow-sm border border-soft">
          <i class="fas fa-clock text-accent/60"></i>
          <span class="text-gray-500">Last updated: <span class="font-medium text-gray-700">Sept 2026</span></span>
        </div>
      </div>
    </div>

    <!-- Brand Filter -->
    <div class="flex flex-wrap gap-2 mb-8">
      <button class="brand-badge active px-4 py-2 rounded-full text-sm font-medium bg-accent text-white shadow-sm transition" data-brand="all">
        <i class="fas fa-motorcycle mr-1"></i> All
      </button>
      <button class="brand-badge px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-700 border border-soft hover:bg-gray-50 transition" data-brand="honda">
        <i class="fas fa-motorcycle mr-1"></i> Honda
      </button>
      <button class="brand-badge px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-700 border border-soft hover:bg-gray-50 transition" data-brand="yamaha">
        <i class="fas fa-motorcycle mr-1"></i> Yamaha
      </button>
      <button class="brand-badge px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-700 border border-soft hover:bg-gray-50 transition" data-brand="suzuki">
        <i class="fas fa-motorcycle mr-1"></i> Suzuki
      </button>
      <button class="brand-badge px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-700 border border-soft hover:bg-gray-50 transition" data-brand="united">
        <i class="fas fa-motorcycle mr-1"></i> United

      <button class="brand-badge px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-700 border border-soft hover:bg-gray-50 transition" data-brand="roadprince">

        <i class="fas fa-motorcycle mr-1"></i> Super Power
      </button>
